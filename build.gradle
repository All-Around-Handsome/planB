plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bmc'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

ext {
    lc4j     = '1.13.0'        // langchain4j core + anthropic (stable)
    lc4jBeta = '1.13.0-beta23' // voyage-ai, qdrant integration modules (beta)
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // LangChain4j core (AiServices, RAG)
    implementation "dev.langchain4j:langchain4j:${lc4j}"
    // Claude (Anthropic) LLM
    implementation "dev.langchain4j:langchain4j-anthropic:${lc4j}"
    // Voyage AI embeddings
    implementation "dev.langchain4j:langchain4j-voyage-ai:${lc4jBeta}"
    // Qdrant vector store
    implementation "dev.langchain4j:langchain4j-qdrant:${lc4jBeta}"

    // .env file loading
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // CSV parsing (yc_s2024.csv etc, safely handles quoted commas)
    implementation 'org.apache.commons:commons-csv:1.11.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }