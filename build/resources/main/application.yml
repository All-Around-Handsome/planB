server:
  port: 8081   # separated from main backend (e.g. 8080). Main backend calls this service via REST

spring:
  application:
    name: bmc-ai-service

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  max-tokens: 4096

voyage:
  api-key: ${VOYAGE_API_KEY}
  model: voyage-4
  dimension: 1024

qdrant:
  host: ${QDRANT_HOST}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  use-tls: ${QDRANT_USE_TLS:true}
  collection: competitor_services

rag:
  top-k: 5
  min-score: 0.5